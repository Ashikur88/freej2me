<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Java Games Collection</title>
  
  <script src="jsziptools.js"></script>
  <script src="webj2me.js"></script>
  
  <style>
    body { background-color: #121212; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 15px; }
    h2 { color: #4caf50; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 10px; display: inline-block; width: 90%; max-width: 400px; }
    select { width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; background: #2b2b2b; color: #fff; margin-bottom: 15px; }
    button { background-color: #2196f3; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; width: 100%; cursor: pointer; }
    #gameContainer { margin-top: 20px; display: flex; justify-content: center; }
  </style>
</head>
<body>

  <h2>🎮 Cloud Java Games</h2>

  <div class="card">
    <label style="display:block; margin-bottom: 10px;">গেম সিলেক্ট করুন:</label>
    <select id="gameSelect">
      <option value="bounceclassic.jar">Bounce Classic</option>
      <option value="bouncetales.jar">Bounce Tales</option>
      <option value="pyramidbloxx.jar">Pyramid Bloxx</option>
      <option value="rfootball10.jar">Real Football 2010</option>
      <option value="rfootball18.jar">Real Football 2018</option>
      <option value="pop.jar">Prince of Persia</option>
      <option value="governator2.jar">Governator 2</option>
      <option value="tcamels.jar">TCamels</option>
    </select>
    <button onclick="playGame()">গেম চালু করুন</button>
  </div>

  <div id="gameContainer"></div>

  <script>
    function playGame() {
      var selectedGame = document.getElementById("gameSelect").value;
      var container = document.getElementById("gameContainer");
      container.innerHTML = "";
      if (typeof J2ME !== 'undefined' && J2ME.run) {
        J2ME.run(selectedGame, container);
      }
    }
  </script>

</body>
</html>
