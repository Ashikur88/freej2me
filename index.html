<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Java Games Collection</title>
  
  <!-- WebJ2ME Player Libraries -->
  <script src="https://unpkg.com/jsziptools@1.0.2/jsziptools.js"></script>
  <script src="https://kalium2020.github.io/webj2me/webj2me.js"></script>
  
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 15px;
    }
    h2 {
      color: #4caf50;
      margin-bottom: 20px;
    }
    .card {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 10px;
      display: inline-block;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #444;
      background-color: #2b2b2b;
      color: #fff;
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    button {
      background-color: #2196f3;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #0b7dda;
    }
    #gameContainer {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>

  <h2>🎮 Cloud Java Games</h2>

  <div class="card">
    <label for="gameSelect" style="display:block; margin-bottom: 10px; font-size: 15px;">গেম সিলেক্ট করুন:</label>
    
    <select id="gameSelect">
      <option value="bounceclassic.jar">Bounce Classic</option>
      <option value="bouncetales.jar">Bounce Tales</option>
      <option value="pyramidbloxx.jar">Pyramid Bloxx</option>
      <option value="rfootball10.jar">Real Football 2010</option>
      <option value="rfootball18.jar">Real Football 2018</option>
      <option value="pop.jar">Prince of Persia</option>
      <option value="governator2.jar">Governator 2</option>
      <option value="tcamels.jar">TCamels</option>
    </select>

    <button onclick="playGame()">গেম চালু করুন</button>
  </div>

  <div id="gameContainer"></div>

  <script>
    function playGame() {
      var selectedGame = document.getElementById("gameSelect").value;
      var container = document.getElementById("gameContainer");
      
      container.innerHTML = "";
      
      if (typeof J2ME !== 'undefined') {
        J2ME.run(selectedGame, container);
      } else {
        alert("ইমুলেটর লোড হতে সমস্যা হয়েছে। ইন্টারনেট কানেকশন যাচাই করুন।");
      }
    }
  </script>

</body>
</html>
